# 管理画面のアカウントを本番のデータベースに作る(Actions の画面から手で動かす。main に入ってから使える)(最初の管理者・製作者用。受付スタッフは管理画面のスタッフの管理から作る)。
# パスワードは GitHub の Secrets の STAFF_INITIAL_PASSWORD(10文字以上)。同じメールアドレスでもう一度動かすと、パスワードを設定し直す。
name: Create staff account

on:
  workflow_dispatch:
    inputs:
      email:
        description: メールアドレス(ログインに使う)
        required: true
      name:
        description: 名前(画面に出る)
        required: true
      role:
        description: 権限
        type: choice
        required: true
        default: admin
        options: [admin, staff, developer]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '1750afed104e032d623e116c11c29b4d' }}

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 本番の D1 の ID を wrangler.toml に入れる
        working-directory: apps/api
        run: node scripts/prepare-production.mjs --no-create
      - name: アカウントを作る
        working-directory: apps/api
        env:
          STAFF_PASSWORD: ${{ secrets.STAFF_INITIAL_PASSWORD }}
        run: |
          if [ -z "$STAFF_PASSWORD" ]; then
            echo "::error::GitHub の Secrets に STAFF_INITIAL_PASSWORD(10文字以上)を登録してください。"
            exit 1
          fi
          pnpm staff:create --email "${{ inputs.email }}" --name "${{ inputs.name }}" --role "${{ inputs.role }}" --remote --env production
          echo "「${{ inputs.email }}」(${{ inputs.role }})を作りました。パスワードは Secrets の STAFF_INITIAL_PASSWORD です。" >> "$GITHUB_STEP_SUMMARY"
