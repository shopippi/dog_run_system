# Cloudflare への配信(本番)。
# - 動くとき: main か deploy/demo(クライアントに見せるデモ用)に push したとき、または Actions の画面の「Run workflow」で手で動かしたとき
# - 必要な Secrets: CLOUDFLARE_API_TOKEN(Workers・D1・R2 を編集できるトークン)
# - 任意の Secrets: STAFF_INITIAL_PASSWORD があれば、管理画面のアカウントがまだ1つもないときに、最初の管理者を作る
#   (メールアドレスは Secret か Variable の ADMIN_EMAIL。なければ admin@greendome.example)
# - 任意の Secrets: LINE_MESSAGING_TOKEN があれば、Worker の secret に入れる(予約の確定・お断りの LINE のお知らせ。21章)。
#   なければお知らせは送らず、予約は今までどおり動く(管理画面の予約の内容に「送っていません(設定がまだ)」と出る)
# アカウント ID と LIFF ID は公開してよい値なので、ここに書く(Variables の CLOUDFLARE_ACCOUNT_ID / LIFF_ID で上書きできる)。
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, deploy/demo]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '1750afed104e032d623e116c11c29b4d' }}
  LIFF_ID: ${{ vars.LIFF_ID || '2012268866-TDSM6zyj' }}

defaults:
  run:
    # 各ステップの出力を1つのファイルにも残す(失敗したときに、最後の部分を注釈に出して、外からも原因が読めるようにする)
    shell: bash -o pipefail -c "exec > >(tee -a \"$RUNNER_TEMP/deploy.log\") 2>&1; bash -eo pipefail {0}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cloudflare のトークン(CLOUDFLARE_API_TOKEN)は GitHub の Environment「Secret」に入っている
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'Secret' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 設定の確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub の Secrets に CLOUDFLARE_API_TOKEN がありません。Settings → Secrets and variables → Actions の Environment「Secret」に登録してください。"
            exit 1
          fi
          pnpm --filter @dr/api exec wrangler whoami

      - name: データベース(D1)と写真の保存先(R2)を用意する(なければ作る)
        working-directory: apps/api
        run: node scripts/prepare-production.mjs

      - name: 画面をビルドする(LIFF ID 入り)
        run: VITE_LIFF_ID="$LIFF_ID" pnpm build

      - name: データベースのマイグレーションを当てる
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production

      - name: LIFF ID を設定に入れる(まだ入っていないときだけ。受付の QR コードと招待の URL に使う)
        working-directory: apps/api
        run: |
          pnpm exec wrangler d1 execute DB --remote --env production --command \
            "INSERT INTO settings (key, value, updated_at) VALUES ('liff_id', '\"${LIFF_ID}\"', strftime('%Y-%m-%dT%H:%M:%S+09:00', 'now', '+9 hours')) ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = excluded.updated_at WHERE settings.value = '\"\"'"

      - name: Worker を配信する
        working-directory: apps/api
        run: |
          pnpm exec wrangler deploy --env production 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          # 外(GitHub の画面以外)からも読めるよう、注釈にも出す
          echo "::notice title=配信先::${URL}/liff/ と ${URL}/admin/"

      - name: LINE のお知らせのトークン(Messaging API)を Worker の secret に入れる(Secrets にあるときだけ)
        working-directory: apps/api
        env:
          LINE_MESSAGING_TOKEN: ${{ secrets.LINE_MESSAGING_TOKEN }}
        run: |
          if [ -z "$LINE_MESSAGING_TOKEN" ]; then
            echo "::notice title=LINE のお知らせ::Secrets に LINE_MESSAGING_TOKEN がないので、予約の確定・お断りの LINE のお知らせは送りません(予約はそのまま使えます)。手順は docs/deploy.md。"
            exit 0
          fi
          # 値はログに出さない(標準入力から渡す)
          printf '%s' "$LINE_MESSAGING_TOKEN" | pnpm exec wrangler secret put LINE_MESSAGING_TOKEN --env production >/dev/null
          echo "LINE_MESSAGING_TOKEN を Worker の secret に入れました。"

      - name: LINE のお知らせのトークンで LINE 公式アカウントにつながるか確かめる(配信は止めない)
        continue-on-error: true
        env:
          LINE_MESSAGING_TOKEN: ${{ secrets.LINE_MESSAGING_TOKEN }}
        run: |
          if [ -z "$LINE_MESSAGING_TOKEN" ]; then
            echo "LINE_MESSAGING_TOKEN がないので、確かめません。"
            exit 0
          fi
          # トークンはヘッダーにだけ入れ、ログには出さない(curl の -v は使わない)
          BODY="$RUNNER_TEMP/line-bot-info.json"
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' -H "Authorization: Bearer ${LINE_MESSAGING_TOKEN}" https://api.line.me/v2/bot/info || echo 000)
          if [ "$STATUS" = "200" ]; then
            INFO=$(node -e 'const j=require(process.argv[1]);process.stdout.write(`${j.displayName ?? ""} / ${j.basicId ?? ""}`)' "$BODY" 2>/dev/null || echo "")
            echo "::notice title=LINEのお知らせ::つながりました(${INFO})"
          else
            echo "::warning title=LINEのお知らせ::LINE 公式アカウントにつながりませんでした(HTTP ${STATUS})。トークンが正しいか、LINE Developers で発行し直して Secret の LINE_MESSAGING_TOKEN を入れ直してください。予約はそのまま使えます。"
          fi
          rm -f "$BODY"
          exit 0

      - name: 最初の管理者を作る(まだ1人もいないときだけ)
        working-directory: apps/api
        env:
          STAFF_PASSWORD: ${{ secrets.STAFF_INITIAL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL || 'admin@greendome.example' }}
        run: |
          if [ -z "$STAFF_PASSWORD" ]; then
            echo "::warning::Secrets に STAFF_INITIAL_PASSWORD がないので、最初の管理者は作りません。登録してからもう一度配信してください。"
            exit 0
          fi
          COUNT=$(pnpm exec wrangler d1 execute DB --remote --env production --json --command "SELECT COUNT(*) AS n FROM staff_users" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].n)})')
          if [ "$COUNT" = "0" ]; then
            pnpm staff:create --email "$ADMIN_EMAIL" --name 管理者 --role admin --remote --env production
            echo "ADMIN_CREATED=1" >> "$GITHUB_ENV"
            echo "::notice title=最初の管理者::${ADMIN_EMAIL} を作りました"
          else
            echo "管理画面のアカウントがすでにあるので、作りません。"
          fi

      # デモで受付の画面を見せるための、仮の受付スタッフ(2026-10-31 依頼主の依頼)。本番運用では Variable の CREATE_DEMO_STAFF を false にする
      - name: デモ用の受付スタッフを作る(まだいないときだけ)
        if: ${{ vars.CREATE_DEMO_STAFF != 'false' }}
        working-directory: apps/api
        env:
          STAFF_PASSWORD: ${{ secrets.STAFF_INITIAL_PASSWORD }}
          DEMO_STAFF_EMAIL: ${{ vars.DEMO_STAFF_EMAIL || 'staff@greendome.example' }}
        run: |
          if [ -z "$STAFF_PASSWORD" ]; then
            echo "::warning::Secrets に STAFF_INITIAL_PASSWORD がないので、デモ用の受付スタッフは作りません。"
            exit 0
          fi
          COUNT=$(pnpm exec wrangler d1 execute DB --remote --env production --json --command "SELECT COUNT(*) AS n FROM staff_users WHERE email = '${DEMO_STAFF_EMAIL}'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].n)})')
          if [ "$COUNT" = "0" ]; then
            pnpm staff:create --email "$DEMO_STAFF_EMAIL" --name "受付スタッフ(デモ)" --role staff --remote --env production
            echo "::notice title=デモ用の受付スタッフ::${DEMO_STAFF_EMAIL} を作りました(パスワードは STAFF_INITIAL_PASSWORD)"
          else
            echo "デモ用の受付スタッフはすでにいるので、作りません。"
          fi

      - name: 配信先のまとめ
        run: |
          {
            echo "## 配信しました"
            echo
            echo "- お客さん向け(LIFF のエンドポイント URL に設定する): \`${DEPLOY_URL}/liff/\`"
            echo "- 受付・管理画面: \`${DEPLOY_URL}/admin/\`"
            echo "- LINE から開く URL(リッチメニュー用): \`https://liff.line.me/${LIFF_ID}/\`"
            echo "- 受付の QR コードの中身: \`https://liff.line.me/${LIFF_ID}/checkin?k=<合言葉>\`(合言葉は管理画面のルールの設定)"
            if [ "${ADMIN_CREATED:-}" = "1" ]; then echo "- 最初の管理者を作りました(メールは ADMIN_EMAIL、パスワードは STAFF_INITIAL_PASSWORD)"; fi
            echo
            echo "LINE Developers の LIFF の「エンドポイント URL」を、上の \`/liff/\` の URL にしてください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗したときの記録(注釈に出す)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/deploy.log"
          [ -f "$f" ] || { echo "::error::記録がありません(ステップの準備で失敗)"; exit 0; }
          tail -n 60 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/tail.log"
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/tail.log" | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=配信の失敗(最後の60行)::${msg}"
