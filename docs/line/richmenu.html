<!doctype html>
<!--
  LINE 公式アカウントのリッチメニューの画像(2500×1686、大)。写真は photos/(施設の写真)。
  作り直すとき: node docs/line/make-richmenu.mjs(Playwright でこの HTML を撮って richmenu.jpg にする)
  押せる場所(左上が 0,0):
    A 会員証       x=0    y=0   w=1666 h=843
    B チェックイン x=1666 y=0   w=834  h=843
    C 来場履歴     x=0    y=843 w=833  h=843
    D ワンちゃん   x=833  y=843 w=833  h=843
    E 使い方       x=1666 y=843 w=834  h=843
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    -webkit-font-smoothing: antialiased; background: #1b2a1e;
  }
  /* 下の段の背景: ドッグランの写真(ぼかして、少し暗く) */
  .run-bg { position: absolute; left: 0; top: 843px; width: 2500px; height: 843px; overflow: hidden; }
  .run-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; filter: blur(14px) saturate(115%); transform: scale(1.08); }
  .run-bg::after { content: ""; position: absolute; inset: 0; background: rgba(10, 20, 12, .30); }
  .cell { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; overflow: hidden; }
  /* A 会員証: 小屋と看板の写真 */
  .card { left: 0; top: 0; width: 1666px; height: 843px; color: #FFFFFF; align-items: flex-start; justify-content: flex-end; padding: 0 110px 92px; }
  .card img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
  .card::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to top, rgba(0,0,0,.74) 0%, rgba(0,0,0,.38) 42%, rgba(0,0,0,0) 72%),
                linear-gradient(to right, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 55%); }
  .card > *:not(img) { position: relative; z-index: 2; }
  .card .main { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; }
  .card h1 { font-size: 160px; font-weight: 600; letter-spacing: .03em; line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .card p { font-size: 70px; opacity: .92; margin-top: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .card .go { display: flex; align-items: center; gap: 18px; padding: 26px 46px 26px 56px; border-radius: 999px; background: rgba(255,255,255,.94); color: #16191D; font-size: 64px; font-weight: 600; }
  /* B チェックイン: ドッグランの写真 */
  .checkin { left: 1672px; top: 0; width: 828px; height: 843px; color: #FFFFFF; }
  .checkin img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 38% 55%; }
  .checkin::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(8, 16, 10, .50); }
  .checkin > *:not(img) { position: relative; z-index: 2; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  /* 下の段: すりガラスのタイル */
  .tile { top: 873px; width: 773px; height: 783px; border-radius: 40px; background: rgba(255,255,255,.90); color: #16191D; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  .t1 { left: 30px; } .t2 { left: 863px; } .t3 { left: 1697px; }
  .label { font-size: 100px; font-weight: 600; letter-spacing: .04em; }
  .sub { font-size: 62px; margin-top: -20px; opacity: .9; }
  svg { display: block; }
</style>
</head>
<body>
  <div class="run-bg"><img src="photos/run.webp" alt="" /></div>
  <div class="cell card">
    <img src="photos/cabin.webp" alt="" />
    <div class="main">
      <div>
        <h1>会員証</h1>
        <p>ポイント・無料券・ワンちゃん</p>
      </div>
      <div class="go">ひらく
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 18 6-6-6-6"/></svg>
      </div>
    </div>
  </div>
  <div class="cell checkin">
    <img src="photos/run.webp" alt="" />
    <svg width="230" height="230" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3M13 16h1"/></svg>
    <div class="label">チェックイン</div>
    <div class="sub">受付の QR を読む</div>
  </div>
  <div class="cell tile t1">
    <svg width="190" height="190" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m8.5 14.5 2.2 2.2 4.8-4.7"/></svg>
    <div class="label">来場履歴</div>
  </div>
  <div class="cell tile t2">
    <svg width="190" height="190" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.2 8.2 3.5 4.5 5v4.2c0 .9.6 1.6 1.4 1.8M14 5.2l1.8-1.7L19.5 5v4.2c0 .9-.6 1.6-1.4 1.8"/><path d="M6 10.5c0 5.4 2.6 9.5 6 9.5s6-4.1 6-9.5C18 7 15.3 5 12 5S6 7 6 10.5z"/><circle cx="9.6" cy="11.5" r=".6" fill="#16191D"/><circle cx="14.4" cy="11.5" r=".6" fill="#16191D"/><path d="M11 15.2h2l-1 1.1z"/></svg>
    <div class="label">ワンちゃん</div>
  </div>
  <div class="cell tile t3">
    <svg width="190" height="190" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".7" fill="#16191D"/></svg>
    <div class="label">使い方</div>
  </div>
</body>
</html>
