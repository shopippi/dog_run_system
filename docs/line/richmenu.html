<!doctype html>
<!--
  リッチメニュー(いま使っている案「雑誌」)。2500×1686。作り直し: node docs/line/make-richmenu.mjs
  ほかの案は alt/(dark: 夜、warm: ぬくもり)
  LINE の「大」6 マス(3 列 × 2 段)。列の区切り x=833・1667、段の区切り y=843。
    A+B 会員証(上の左 2 マス)  C チェックイン(上の右)
    D 来場の記録(下の左)        E ワンちゃん(下のまん中)  F 使い方(下の右)
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="fonts" content="600 100px 'Shippori Mincho B1' | 500 50px 'Zen Kaku Gothic New'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@500&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #F5F6F7; --ink: #16191D; --ink-2: #5B6470; --rule: #E3E6EA;
    --c1: 833px; --c2: 1667px; --r1: 843px;
    --pad: 104px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--ink); font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; }
  svg { display: block; }
  .mincho { font-family: 'Shippori Mincho B1', serif; font-weight: 600; }
  .cell { position: absolute; overflow: hidden; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* A+B 会員証: 小屋の写真を全面に。下から墨のスクリム */
  .card { left: 0; top: 0; width: var(--c2); height: var(--r1); color: #FFFFFF; }
  .card .photo { inset: auto; left: 0; top: -250px; width: 1960px; height: auto; filter: saturate(.9) contrast(1.05); }
  .card::after { content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(14,16,19,.78) 0%, rgba(14,16,19,.5) 40%, rgba(14,16,19,0) 66%),
      linear-gradient(to top, rgba(14,16,19,.78) 0%, rgba(14,16,19,.2) 45%, rgba(14,16,19,0) 70%),
      linear-gradient(to bottom, rgba(14,16,19,.45) 0%, rgba(14,16,19,0) 30%); }
  .card > .in { position: absolute; inset: 0; z-index: 2; padding: 88px var(--pad) 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-size: 58px; letter-spacing: .08em; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; }
  .hero h1 { font-size: 156px; letter-spacing: .01em; white-space: nowrap; line-height: 1; text-shadow: 0 2px 24px rgba(0,0,0,.25); }
  .hero p { font-size: 56px; margin-top: 36px; color: rgba(255,255,255,.9); letter-spacing: .04em; }
  .go { width: 216px; height: 216px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: rgba(255,255,255,.16); border: 2.5px solid rgba(255,255,255,.62);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); }

  /* C チェックイン: ドッグランの写真を墨のダブルトーンに */
  .checkin { left: var(--c2); top: 0; width: calc(2500px - var(--c2)); height: var(--r1); color: #FFFFFF; background: var(--ink); }
  .checkin .photo { object-position: 28% 55%; filter: grayscale(1) contrast(1.2); opacity: .42; }
  .checkin::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,16,19,.7), rgba(14,16,19,.2)); }

  /* 下の段: 紙の上に、細い罫線で区切った目次のような 3 マス */
  .rule { position: absolute; top: calc(var(--r1) + 96px); bottom: 96px; width: 2px; background: var(--rule); }
  .tile { top: var(--r1); height: calc(1686px - var(--r1)); }
  .d { left: 0; width: var(--c1); } .e { left: var(--c1); width: calc(var(--c2) - var(--c1)); } .f { left: var(--c2); width: calc(2500px - var(--c2)); }

  .in2 { position: absolute; inset: 0; z-index: 2; padding: 96px var(--pad) 100px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .label { font-size: 100px; letter-spacing: 0; line-height: 1.1; white-space: nowrap; }
  .sub { font-size: 50px; margin-top: 28px; letter-spacing: .03em; color: var(--ink-2); white-space: nowrap; }

  .checkin .sub { color: rgba(255,255,255,.84); }
</style>
</head>
<body>
  <!-- A+B 会員証 -->
  <div class="cell card">
    <img class="photo" src="photos/cabin.webp" alt="" />
    <div class="grain"></div>
    <div class="in">
      <div class="brand mincho">グリーンドーム</div>
      <div class="hero">
        <div>
          <h1 class="mincho">会員証をひらく</h1>
          <p>ポイント・無料券・ワンちゃん</p>
        </div>
        <div class="go">
          <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- C チェックイン -->
  <div class="cell checkin">
    <img class="photo" src="photos/run.webp" alt="" />
    <div class="in2">
      <div class="top">
        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"/><rect x="7.5" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="13" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="7.5" y="13" width="3.5" height="3.5" rx=".5"/><path d="M13 13h3.5v3.5M13 16.5h.01"/></svg>
      </div>
      <div>
        <div class="label mincho">チェックイン</div>
        <div class="sub">受付の QR を読む</div>
      </div>
    </div>
  </div>

  <!-- 下の段 -->
  <div class="rule" style="left: 832px"></div>
  <div class="rule" style="left: 1666px"></div>

  <div class="cell tile d">
    <div class="in2">
      <div class="top">
        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m8.8 14.6 2.2 2.2 4.4-4.4"/></svg>
      </div>
      <div class="bottom">
        <div class="label mincho">来場の記録</div>
        <div class="sub">これまでの来場と無料券</div>
      </div>
    </div>
  </div>

  <div class="cell tile e">
    <div class="in2">
      <div class="top">
        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 6.4C6.6 5.2 4.2 5.6 3.4 7.6c-.7 1.8-.3 4.5 1.3 5.6.8.5 1.6.2 1.9-.5"/><path d="M15.8 6.4c1.6-1.2 4-.8 4.8 1.2.7 1.8.3 4.5-1.3 5.6-.8.5-1.6.2-1.9-.5"/><path d="M6.6 10.6C6.6 7.6 9 5.5 12 5.5s5.4 2.1 5.4 5.1v3.2c0 3.6-2.4 6.2-5.4 6.2s-5.4-2.6-5.4-6.2z"/><circle cx="9.9" cy="11.6" r=".55" fill="#16191D"/><circle cx="14.1" cy="11.6" r=".55" fill="#16191D"/><path d="M11 14.6h2c.3 0 .4.3.2.5l-1 .9-1-.9c-.2-.2-.1-.5.2-.5zM12 16v.9M10.6 17.4c.8.5 2 .5 2.8 0"/></svg>
      </div>
      <div class="bottom">
        <div class="label mincho">ワンちゃん</div>
        <div class="sub">うちの子の写真と情報</div>
      </div>
    </div>
  </div>

  <div class="cell tile f">
    <div class="in2">
      <div class="top">
        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 7.6 4.5 3.5 4.8v13.4c4.1-.3 6.8.2 8.5 1.8 1.7-1.6 4.4-2.1 8.5-1.8V4.8c-4.1-.3-6.8.2-8.5 1.7zM12 6.5V20"/></svg>
      </div>
      <div class="bottom">
        <div class="label mincho">使い方</div>
        <div class="sub">よくある質問</div>
      </div>
    </div>
  </div>
<script>
  // Google Fonts の和文は「palt」(かなを詰める)が効かないので、小さいかなと中黒だけ手で詰める
  document.querySelectorAll('h1, p, .label, .sub, .brand').forEach((el) => {
    el.innerHTML = el.innerHTML.replace(/([ぁぃぅぇぉっゃゅょァィゥェォッャュョ])/g, '<span style="margin:0 -.09em">$1</span>').replace(/・/g, '<span style="margin:0 -.22em">・</span>');
  });
</script>
</body>
</html>
