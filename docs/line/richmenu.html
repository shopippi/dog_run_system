<!doctype html>
<!--
  LINE 公式アカウントのリッチメニューの画像(2500×1686、大)。
  作り直すとき: node docs/line/make-richmenu.mjs(Playwright でこの HTML を撮って richmenu.png にする)
  押せる場所(左上が 0,0):
    A 会員証       x=0    y=0   w=1666 h=843
    B チェックイン x=1666 y=0   w=834  h=843
    C 来場履歴     x=0    y=843 w=833  h=843
    D ワンちゃん   x=833  y=843 w=833  h=843
    E 使い方       x=1666 y=843 w=834  h=843
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    background: #E3E6EA; display: grid; gap: 6px;
    grid-template-columns: 833px 833px 822px; grid-template-rows: 840px 840px;
    -webkit-font-smoothing: antialiased;
  }
  .cell { background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; color: #16191D; }
  .card { grid-column: 1 / span 2; background: #16191D; color: #FFFFFF; align-items: flex-start; justify-content: space-between; padding: 96px 110px; }
  .card .top { display: flex; align-items: center; gap: 28px; font-size: 72px; font-weight: 600; letter-spacing: .02em; opacity: .78; }
  .card .main { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; }
  .card h1 { font-size: 150px; font-weight: 600; letter-spacing: .02em; line-height: 1.1; }
  .card p { font-size: 76px; opacity: .78; margin-top: 26px; }
  .card .paws { display: flex; gap: 26px; }
  .label { font-size: 100px; font-weight: 600; letter-spacing: .04em; }
  .sub { font-size: 66px; color: #5B6470; margin-top: -24px; }
  svg { display: block; }
</style>
</head>
<body>
  <div class="cell card">
    <div class="top">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="#FFFFFF"><ellipse cx="7" cy="8" rx="2" ry="2.6"/><ellipse cx="12" cy="6" rx="2" ry="2.6"/><ellipse cx="17" cy="8" rx="2" ry="2.6"/><ellipse cx="4.6" cy="12.6" rx="1.8" ry="2.3"/><ellipse cx="19.4" cy="12.6" rx="1.8" ry="2.3"/><path d="M12 11c-3.4 0-6.4 3.6-6.4 6.3 0 1.7 1.3 2.7 3 2.7 1.3 0 2.2-.6 3.4-.6s2.1.6 3.4.6c1.7 0 3-1 3-2.7 0-2.7-3-6.3-6.4-6.3z"/></svg>
      グリーンドーム
    </div>
    <div class="main">
      <div>
        <h1>会員証</h1>
        <p>ポイント・無料券・ワンちゃん</p>
      </div>
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 18 6-6-6-6"/></svg>
    </div>
  </div>
  <div class="cell">
    <svg width="230" height="230" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3M13 16h1"/></svg>
    <div class="label">チェックイン</div>
    <div class="sub">受付の QR を読む</div>
  </div>
  <div class="cell">
    <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m8.5 14.5 2.2 2.2 4.8-4.7"/></svg>
    <div class="label">来場履歴</div>
  </div>
  <div class="cell">
    <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.2 8.2 3.5 4.5 5v4.2c0 .9.6 1.6 1.4 1.8M14 5.2l1.8-1.7L19.5 5v4.2c0 .9-.6 1.6-1.4 1.8"/><path d="M6 10.5c0 5.4 2.6 9.5 6 9.5s6-4.1 6-9.5C18 7 15.3 5 12 5S6 7 6 10.5z"/><circle cx="9.6" cy="11.5" r=".6" fill="#16191D"/><circle cx="14.4" cy="11.5" r=".6" fill="#16191D"/><path d="M11 15.2h2l-1 1.1z"/></svg>
    <div class="label">ワンちゃん</div>
  </div>
  <div class="cell">
    <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".7" fill="#16191D"/></svg>
    <div class="label">使い方</div>
  </div>
</body>
</html>
