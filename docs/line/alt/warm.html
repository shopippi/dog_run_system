<!doctype html>
<!--
  リッチメニュー「ぬくもり」の案。2500×1686。作り直し: node docs/line/make-richmenu.mjs warm
  LINE の「大」6 マス(3 列 × 2 段)。列の区切り x=833・1667、段の区切り y=843。
  カードは区切りから 20px ずつ内側に置き、区切りの上に 40px のすき間がくるようにしている。
    A+B 会員証(上の左 2 マス)  C チェックイン(上の右)
    D 預かり・お泊まり(下の左)  E 写真を買う(下のまん中)  F 使い方(下の右)
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="fonts" content="700 100px 'Zen Maru Gothic' | 500 50px 'Zen Maru Gothic'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=block" rel="stylesheet" />
<style>
  :root {
    --cream: #F1F3F5; --card: #FFFFFF; --ink: #16191D; --ink-2: #5B6470; --sunk: #F1F3F5;
    --g: 20px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body { position: relative; background: var(--cream); color: var(--ink); font-family: 'Zen Maru Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .card { position: absolute; border-radius: 52px; overflow: hidden; background: var(--card); box-shadow: 0 1px 0 rgba(16,24,40,.04), 0 16px 40px rgba(16,24,40,.08); }


  /* A+B 会員証: 左に言葉、右に小屋の写真 */
  .hero { left: 40px; top: 40px; width: calc(1667px - 40px - var(--g)); height: calc(843px - 40px - var(--g)); background: var(--ink); color: #FFFFFF; }
  .hero .ph { position: absolute; right: 0; top: 0; width: 900px; height: 100%; overflow: hidden; border-radius: 0 52px 52px 0; }
  .hero .ph img { position: absolute; left: -330px; top: -330px; width: 1720px; height: auto; filter: saturate(.95) contrast(1.03); }
  .hero .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, var(--ink) 0%, rgba(22,25,29,.55) 22%, rgba(22,25,29,0) 48%); }
  .hero .in { position: absolute; left: 0; top: 0; bottom: 0; width: 900px; padding: 80px 0 84px 92px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
  .brand { font-size: 52px; font-weight: 700; letter-spacing: .04em; }
  .hero h1 { font-size: 150px; font-weight: 700; line-height: 1.12; letter-spacing: 0; }
  .hero p { margin-top: 34px; font-size: 54px; font-weight: 500; color: rgba(255,255,255,.86); }

  /* C チェックイン: 上に写真、下に言葉 */
  .c { left: calc(1667px + var(--g)); top: 40px; width: calc(2500px - 1667px - var(--g) - 40px); height: calc(843px - 40px - var(--g)); }
  .c .ph { position: absolute; left: 0; right: 0; top: 0; height: 360px; overflow: hidden; }
  .c .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 35% 52%; filter: saturate(.78); }
  .c .badge { position: absolute; left: 72px; top: 280px; width: 160px; height: 160px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; border: 8px solid var(--card); }
  .c .txt { position: absolute; left: 72px; right: 60px; bottom: 76px; }

  .d { left: 40px; top: calc(843px + var(--g)); width: calc(833px - 40px - var(--g)); height: calc(1686px - 843px - var(--g) - 40px); }
  .e { left: calc(833px + var(--g)); top: calc(843px + var(--g)); width: calc(1667px - 833px - 2 * var(--g)); height: calc(1686px - 843px - var(--g) - 40px); }
  .f { left: calc(1667px + var(--g)); top: calc(843px + var(--g)); width: calc(2500px - 1667px - var(--g) - 40px); height: calc(1686px - 843px - var(--g) - 40px); }
  .tile .in { position: absolute; inset: 0; padding: 76px 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .ic { width: 188px; height: 188px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; position: relative; }
  .label { font-size: 96px; font-weight: 700; line-height: 1.12; white-space: nowrap; }
  /* 下の段は「預かり・お泊まり」(8 文字)が 1 行に入る大きさにそろえる */
  .d .label, .e .label, .f .label { font-size: 82px; }
  .sub { margin-top: 22px; font-size: 48px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
</style>
</head>
<body>

  <div class="card hero">
    <div class="ph"><img src="../photos/cabin.webp" alt="" /></div>
    <div class="in">
      <div class="brand">
        グリーンドーム
      </div>
      <div>
        <h1>会員証を<br />ひらく</h1>
        <p>ポイント・無料券・ワンちゃん</p>
      </div>
    </div>
  </div>

  <div class="card c">
    <div class="ph"><img src="../photos/run.webp" alt="" /></div>
    <div class="badge"><svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"/><rect x="7.5" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="13" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="7.5" y="13" width="3.5" height="3.5" rx=".5"/><path d="M13 13h3.5v3.5M13 16.5h.01"/></svg></div>
    <div class="txt"><div class="label">チェックイン</div><div class="sub">受付の QR を読む</div></div>
  </div>

  <div class="card tile d">
    <div class="in">
      <div class="ic"><svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4.2l8 6.6v8.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M13.4 11.6a3.1 3.1 0 1 0 2.4 4.9 2.5 2.5 0 0 1-2.4-4.9z"/></svg></div>
      <div><div class="label">預かり・お泊まり</div><div class="sub">予約する</div></div>
    </div>
  </div>

  <div class="card tile e">
    <div class="in">
      <div class="ic"><svg width="112" height="112" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.6A1.6 1.6 0 0 1 5.1 7h2.5l1.5-2.1h5.8L16.4 7h2.5a1.6 1.6 0 0 1 1.6 1.6v9.3a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6z"/><circle cx="12" cy="13.2" r="3.7"/><path d="M17.4 10h.01"/></svg></div>
      <div><div class="label">写真を買う</div><div class="sub">ドッグランで撮った写真</div></div>
    </div>
  </div>

  <div class="card tile f">
    <div class="in">
      <div class="ic"><svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 7.6 4.5 3.5 4.8v13.4c4.1-.3 6.8.2 8.5 1.8 1.7-1.6 4.4-2.1 8.5-1.8V4.8c-4.1-.3-6.8.2-8.5 1.7zM12 6.5V20"/></svg></div>
      <div><div class="label">使い方</div><div class="sub">よくある質問</div></div>
    </div>
  </div>
<script>
  // Google Fonts の和文は「palt」(かなを詰める)が効かないので、小さいかなと中黒だけ手で詰める
  document.querySelectorAll('h1, p, .label, .sub').forEach((el) => {
    el.innerHTML = el.innerHTML.replace(/([ぁぃぅぇぉっゃゅょァィゥェォッャュョ])/g, '<span style="margin:0 -.09em">$1</span>').replace(/・/g, '<span style="margin:0 -.22em">・</span>');
  });
</script>
</body>
</html>
