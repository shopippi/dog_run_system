<!doctype html>
<!--
  リッチメニュー「夜」の案。2500×1686。作り直し: node docs/line/make-richmenu.mjs dark
  LINE の「大」6 マス(3 列 × 2 段)。列の区切り x=833・1667、段の区切り y=843。
  カードは区切りから 20px ずつ内側に置き、区切りの上に 40px のすき間がくるようにしている。
    A+B 会員証(上の左 2 マス)  C チェックイン(上の右)
    D 来場の記録(下の左)        E ワンちゃん(下のまん中)  F 使い方(下の右)
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="fonts" content="500 100px 'Zen Kaku Gothic New' | 700 100px 'Zen Kaku Gothic New'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #0F1113; --text: #ECEEF0; --text-2: #A7AFB8; --line: rgba(255,255,255,.14);
    --g: 20px; /* 区切りからカードまで */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--text); font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }

  /* 下地: ドッグランの写真を大きくぼかして、ほとんど黒に沈める */
  .bg { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px); object-fit: cover; filter: blur(48px) saturate(.35) brightness(.24); }
  .bg-tone { position: absolute; inset: 0; background: linear-gradient(rgba(15,17,19,.35), rgba(15,17,19,.55)); }

  .card { position: absolute; border-radius: 44px; overflow: hidden; }
  .glass { background: rgba(255,255,255,.065); border: 2px solid var(--line);
    backdrop-filter: blur(30px) saturate(130%); -webkit-backdrop-filter: blur(30px) saturate(130%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.06); }

  /* A+B 会員証 */
  .hero { left: 40px; top: 40px; width: calc(1667px - 40px - var(--g)); height: calc(843px - 40px - var(--g)); }
  .hero img { position: absolute; left: 0; top: -300px; width: 1900px; height: auto; filter: saturate(.75) contrast(1.08) brightness(.9); }
  .hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px rgba(255,255,255,.10);
    background: linear-gradient(to right, rgba(12,13,15,.92) 0%, rgba(12,13,15,.7) 38%, rgba(12,13,15,.05) 72%), linear-gradient(to top, rgba(12,13,15,.6), rgba(12,13,15,0) 50%); }
  .hero .in { position: absolute; inset: 0; z-index: 2; padding: 76px 88px 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { display: flex; align-items: center; gap: 28px; font-size: 50px; letter-spacing: .1em; color: var(--text); }
  .hero h1 { font-size: 150px; font-weight: 700; letter-spacing: -.01em; line-height: 1; white-space: nowrap; }
  .hero p { margin-top: 38px; font-size: 54px; color: rgba(242,241,238,.86); font-weight: 500; }
  .hero .row { display: flex; align-items: flex-end; justify-content: space-between; }
  .go { width: 200px; height: 200px; border-radius: 50%; background: #ECEEF0; display: grid; place-items: center; flex: none; box-shadow: 0 16px 48px rgba(0,0,0,.35); }

  /* C と下の段: すりガラスのカード */
  .c { left: calc(1667px + var(--g)); top: 40px; width: calc(2500px - 1667px - var(--g) - 40px); height: calc(843px - 40px - var(--g)); }
  .d { left: 40px; top: calc(843px + var(--g)); width: calc(833px - 40px - var(--g)); height: calc(1686px - 843px - var(--g) - 40px); }
  .e { left: calc(833px + var(--g)); top: calc(843px + var(--g)); width: calc(1667px - 833px - 2 * var(--g)); height: calc(1686px - 843px - var(--g) - 40px); }
  .f { left: calc(1667px + var(--g)); top: calc(843px + var(--g)); width: calc(2500px - 1667px - var(--g) - 40px); height: calc(1686px - 843px - var(--g) - 40px); }
  .tile .in { position: absolute; inset: 0; padding: 72px 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .ic { width: 176px; height: 176px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); display: grid; place-items: center; background: rgba(255,255,255,.04); }
  .label { font-size: 96px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
  .sub { margin-top: 24px; font-size: 48px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  /* チェックインだけ、少し明るい面にして 2 番目に目立たせる */
  .c.glass { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
  .c .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%; filter: saturate(.5) brightness(.75); opacity: .55; }
  .c .ph-tone { position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,13,15,.92) 8%, rgba(12,13,15,.35) 70%, rgba(12,13,15,.2)); }
</style>
</head>
<body>
  <img class="bg" src="../photos/run.webp" alt="" />
  <div class="bg-tone"></div>

  <div class="card hero">
    <img src="../photos/cabin.webp" alt="" />
    <div class="in">
      <div class="eyebrow">グリーンドーム</div>
      <div class="row">
        <div>
          <h1>会員証をひらく</h1>
          <p>ポイント・無料券・ワンちゃん</p>
        </div>
        <div class="go"><svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
    </div>
  </div>

  <div class="card glass tile c">
    <img class="ph" src="../photos/run.webp" alt="" /><div class="ph-tone"></div>
    <div class="in">
      <div class="top">
        <div class="ic"><svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#ECEEF0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"/><rect x="7.5" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="13" y="7.5" width="3.5" height="3.5" rx=".5"/><rect x="7.5" y="13" width="3.5" height="3.5" rx=".5"/><path d="M13 13h3.5v3.5M13 16.5h.01"/></svg></div>
      </div>
      <div><div class="label">チェックイン</div><div class="sub">受付の QR を読む</div></div>
    </div>
  </div>

  <div class="card glass tile d">
    <div class="in">
      <div class="top">
        <div class="ic"><svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#ECEEF0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m8.8 14.6 2.2 2.2 4.4-4.4"/></svg></div>
      </div>
      <div><div class="label">来場の記録</div><div class="sub">これまでの来場と無料券</div></div>
    </div>
  </div>

  <div class="card glass tile e">
    <div class="in">
      <div class="top">
        <div class="ic"><svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#ECEEF0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 6.4C6.6 5.2 4.2 5.6 3.4 7.6c-.7 1.8-.3 4.5 1.3 5.6.8.5 1.6.2 1.9-.5"/><path d="M15.8 6.4c1.6-1.2 4-.8 4.8 1.2.7 1.8.3 4.5-1.3 5.6-.8.5-1.6.2-1.9-.5"/><path d="M6.6 10.6C6.6 7.6 9 5.5 12 5.5s5.4 2.1 5.4 5.1v3.2c0 3.6-2.4 6.2-5.4 6.2s-5.4-2.6-5.4-6.2z"/><circle cx="9.9" cy="11.6" r=".55" fill="#ECEEF0"/><circle cx="14.1" cy="11.6" r=".55" fill="#ECEEF0"/><path d="M11 14.6h2c.3 0 .4.3.2.5l-1 .9-1-.9c-.2-.2-.1-.5.2-.5zM12 16v.9M10.6 17.4c.8.5 2 .5 2.8 0"/></svg></div>
      </div>
      <div><div class="label">ワンちゃん</div><div class="sub">うちの子の写真と情報</div></div>
    </div>
  </div>

  <div class="card glass tile f">
    <div class="in">
      <div class="top">
        <div class="ic"><svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#ECEEF0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 7.6 4.5 3.5 4.8v13.4c4.1-.3 6.8.2 8.5 1.8 1.7-1.6 4.4-2.1 8.5-1.8V4.8c-4.1-.3-6.8.2-8.5 1.7zM12 6.5V20"/></svg></div>
      </div>
      <div><div class="label">使い方</div><div class="sub">よくある質問</div></div>
    </div>
  </div>
<script>
  // Google Fonts の和文は「palt」(かなを詰める)が効かないので、小さいかなと中黒だけ手で詰める
  document.querySelectorAll('h1, p, .label, .sub, .eyebrow').forEach((el) => {
    el.innerHTML = el.innerHTML.replace(/([ぁぃぅぇぉっゃゅょァィゥェォッャュョ])/g, '<span style="margin:0 -.09em">$1</span>').replace(/・/g, '<span style="margin:0 -.22em">・</span>');
  });
</script>
</body>
</html>
