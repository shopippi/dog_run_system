# Cloudflare Workers の設定。API と、お客さん向け画面(/liff/)・管理画面(/admin/)を同じドメインから配信する。
# 同じドメインにすることで、管理画面のログイン(クッキー)が iPad の Safari でも保たれる。
name = "dog-run"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# API はつねに Worker で処理する。画面のファイルが見つからないときも Worker に回し、各アプリの index.html を返す。
run_worker_first = ["/api/*", "/admin/api/*"]
not_found_handling = "none"

[vars]
# local: 開発用(LINEのログインをモックにできる) / test: テスト環境 / production: 本番
ENVIRONMENT = "local"
# LINE ログインチャネルのチャネルID(公開してよい値)。IDトークンの検証に使う。
LINE_CHANNEL_ID = "0000000000"
# local のときだけ、LINE の代わりにモックのIDトークンを受け付ける
LINE_LOGIN_MOCK = "1"
# local のときだけ、写真販売の支払いを Stripe の代わりのまねにする(docs/photo-requirements.md 8.3。本番では効かない)
STRIPE_MOCK = "1"

[[d1_databases]]
binding = "DB"
database_name = "dog-run"
# 本番・テスト環境では `wrangler d1 create dog-run` で作ったIDに置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dog-run-media"

[triggers]
# 日本時間 3:10(日別集計・期限切れ・バックアップ)と 5:10(天気)。cron は UTC で書く。
crons = ["10 18 * * *", "10 20 * * *"]

# 本番の設定例。`wrangler deploy --env production` で使う。
[env.production]
name = "dog-run-production"

[env.production.vars]
ENVIRONMENT = "production"
# グリーンドームの LINE ログインチャネル(LIFF ID 2012268866-TDSM6zyj の前半)
LINE_CHANNEL_ID = "2012268866"
LINE_LOGIN_MOCK = "0"
STRIPE_MOCK = "0"
# 写真販売の R2(docs/photo-requirements.md 7章)。R2 を有効にしたら、次の2行の # を外して値を入れる(どちらも公開してよい値)。
# R2_ACCOUNT_ID = "<Cloudflare のアカウントID>"
# PHOTOS_BUCKET_NAME = "dog-run-production-photos"

[[env.production.d1_databases]]
binding = "DB"
database_name = "dog-run-production"
# 配信のとき(.github/workflows/deploy.yml)に、`wrangler d1 info` で調べた本当の ID に置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 写真の保存先(R2)は、いまは使わない。R2 がないときは、写真をデータベース(media_objects)に保存する(src/lib/d1-media.ts)。
# R2 を使うようになったら、次の3行の # を外す(バックアップも R2 に取れるようになる)。
# [[env.production.r2_buckets]]
# binding = "MEDIA"
# bucket_name = "dog-run-production-media"

# 写真販売の写真の置き場所(R2。非公開のバケット。r2.dev の公開URLもカスタムドメインも付けない)。
# いまは使わない(写真販売は「準備中」のまま)。R2 を有効にしたら、次の手順で使い始める(docs/photo-requirements.md 7.4):
#   1. `wrangler r2 bucket create dog-run-production-photos`
#   2. R2 の「API トークン」で、このバケットだけの「オブジェクトの読み書き」のトークンを作り、
#      `wrangler secret put R2_ACCESS_KEY_ID --env production` と `wrangler secret put R2_SECRET_ACCESS_KEY --env production` で入れる
#   3. バケットの CORS に、管理画面のドメインからの PUT(ETag ヘッダーを見せる)を足す
#   4. 上の R2_ACCOUNT_ID・PHOTOS_BUCKET_NAME と、次の3行の # を外して配信する
# [[env.production.r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "dog-run-production-photos"

[env.production.triggers]
crons = ["10 18 * * *", "10 20 * * *"]
